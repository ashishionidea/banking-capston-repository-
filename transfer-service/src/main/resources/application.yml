server:
  port: 8083
spring:
  application:
    name: transfer-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/transfer_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: transfer-saga
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ashish.banking.transferservice.messaging
        spring.json.use.type.headers: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000/realms/banking}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
app:
  kafka:
    topics:
      transfer-commands: banking.transfer.commands
