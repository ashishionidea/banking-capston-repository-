server:
  port: 8888
spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/ashishionidea/banking-config-repository}
          default-label: main
          clone-on-start: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
