services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:-banking}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: banking_platform
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD","/opt/kafka/bin/kafka-topics.sh","--bootstrap-server","localhost:9092","--list"]
      interval: 10s
      timeout: 10s
      retries: 12
  service-registry:
    build: ./service-registry
    ports: ["8761:8761"]
  config-server:
    build: ./config-server
    depends_on: [service-registry]
    environment:
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/ashishionidea/banking-config-repository}
    ports: ["8888:8888"]
  customer-service:
    build: ./customer-service
    depends_on: [mysql,service-registry,config-server]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/customer_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-banking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
      PII_AES_KEY_B64: ${PII_AES_KEY_B64:-}
    ports: ["8081:8081"]
  account-service:
    build: ./account-service
    depends_on: [mysql,service-registry,config-server]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/account_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-banking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
    ports: ["8082:8082"]
  transfer-service:
    build: ./transfer-service
    depends_on: [mysql,kafka,service-registry]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/transfer_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-banking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
    ports: ["8083:8083"]
  bill-payment-service:
    build: ./bill-payment-service
    depends_on: [mysql,kafka,service-registry]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bill_payment_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-banking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
    ports: ["8084:8084"]
  statement-service:
    build: ./statement-service
    depends_on: [mysql,service-registry,account-service]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/statement_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-banking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      ACCOUNT_SERVICE_URL: http://account-service:8082
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
    ports: ["8085:8085"]
  loan-service:
    build: ./loan-service
    depends_on: [mysql,service-registry]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/loan_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-banking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
    ports: ["8086:8086"]
  support-service:
    build: ./support-service
    depends_on: [mysql,service-registry]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/support_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-banking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
    ports: ["8087:8087"]
  notification-service:
    build: ./notification-service
    depends_on: [mysql,service-registry]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/notification_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-banking}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
    ports: ["8088:8088"]
  api-gateway:
    build: ./api-gateway
    depends_on: [service-registry,customer-service,account-service,transfer-service,bill-payment-service,statement-service,loan-service,support-service,notification-service]
    environment:
      EUREKA_URL: http://service-registry:8761/eureka
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:9000/realms/banking}
    ports: ["8080:8080"]
volumes:
  mysql_data: